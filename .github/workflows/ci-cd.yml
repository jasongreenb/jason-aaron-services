name: Java CI/CD Pipeline

on:
  push:
    branches: ["dev", "main"]

jobs:
  #CI job, this will build and test our pushed code and then set up downstream resources for CD
  build-and-test:
    name: Build, Test & Push Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Unit Tests
        run: mvn clean test

      - name: Build Jar
        run: mvn package -DskipTests

      - name: Upload Jar Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-binary
          path: target/*.jar
          retention-days: 5

